<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TAG TOKYO | 東京で、ちゃんと会える。</title>
<meta name="description" content="東京限定の無料マッチングサービス。認証タグ、選択式トーク、60分プランで、安心して会う約束まで進めます。">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAG TOKYO">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1RKFX1HCCV"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());
gtag('config','G-1RKFX1HCCV',{content_group:'tag_tokyo'});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;
  --ink:#f7f8fb;
  --muted:#8f99aa;
  --soft:#c9d0dc;
  --panel:#161417;
  --panel-2:#211d21;
  --line:rgba(201,208,220,.12);
  --cyan:#6ee7c2;
  --violet:#f0a8c3;
  --pink:#ff6b8a;
  --green:#55d69f;
  --amber:#fbbf24;
  --red:#f87171;
  --radius:14px;
  --radius-sm:10px;
  --en:"Space Grotesk",-apple-system,sans-serif;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7;
  min-height:100dvh;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:#0b0b0d}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.en{font-family:var(--en)}
#app{
  position:relative;z-index:1;
  width:min(100%,520px);margin:0 auto;
  min-height:100dvh;
  display:flex;flex-direction:column;
}
.app-bar{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + var(--sat)) 18px 10px;
  display:flex;align-items:center;gap:10px;
  background:rgba(5,7,11,.82);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.app-bar .mark{
  width:30px;height:30px;display:grid;place-items:center;border-radius:9px;
  border:1px solid rgba(201,208,220,.18);
  background:linear-gradient(135deg,rgba(125,211,252,.14),rgba(167,139,250,.12));
  color:#dbeafe;
}
.app-bar .mark svg{width:17px;height:17px}
.app-bar .word{font-family:var(--en);font-weight:700;font-size:16px}
.app-bar .word span{font-weight:500;color:var(--soft)}
.bar-pill{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  color:#bbf7d0;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.26);
  font-size:11px;font-weight:800;
}
.screen{flex:1;padding:18px 18px calc(86px + var(--sab));display:none}
.screen.on{display:block}
.screen-title{font-size:24px;font-weight:780;line-height:1.3;margin:6px 0 4px}
.screen-sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.panel{
  border:1px solid var(--line);border-radius:var(--radius);
  background:rgba(12,16,24,.85);
}
.pad{padding:16px}
.btn{
  min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid transparent;border-radius:999px;padding:0 20px;width:100%;
  font-weight:760;color:var(--ink);background:var(--panel-2);
  transition:transform .15s,opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{
  color:#05070a;
  background:linear-gradient(120deg,#e0f2fe,#f7f8fb 55%,#ede9fe);
}
.btn-outline{border-color:rgba(201,208,220,.2);background:rgba(247,248,251,.04)}
.btn-ghost{border-color:rgba(125,211,252,.22);background:rgba(125,211,252,.06);color:#d7efff}
.btn-danger{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#fecaca}
.btn-sm{min-height:36px;padding:0 14px;width:auto;font-size:13px}

/* tags / chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:4px 11px;border-radius:999px;
  font-size:12.5px;font-weight:700;color:var(--tag-c,#d7efff);
  background:var(--tag-bg,rgba(125,211,252,.06));border:1px solid var(--tag-border,rgba(125,211,252,.2));
}
.tag.l8,.tag.l9,.tag.l10{box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
.tag.area{color:#fbe3f1;background:rgba(244,114,182,.09);border-color:rgba(244,114,182,.28)}
.tag-level{
  display:inline-grid;place-items:center;min-width:36px;height:20px;padding:0 7px;border-radius:999px;
  font-family:var(--en);font-size:10.5px;font-weight:800;line-height:1;color:var(--tag-badge-ink,#05070b);
  background:var(--tag-badge,#7dd3fc);
}
.chip-btn{
  display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:6px 14px;border-radius:999px;
  font-size:13px;font-weight:700;color:#c9d0dc;
  background:rgba(247,248,251,.03);border:1px solid rgba(201,208,220,.18);
  transition:border-color .15s,background .15s,color .15s;
}
.chip-btn[aria-pressed="true"]{
  color:#fbe3f1;background:rgba(244,114,182,.1);border-color:rgba(244,114,182,.5);
}
.cat-label{font-size:12px;color:var(--muted);font-weight:800;margin:16px 0 8px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:13px;color:var(--soft);font-weight:800}
.field input,.field select,.field textarea{
  width:100%;min-height:48px;color:var(--ink);
  border:1px solid rgba(201,208,220,.16);border-radius:12px;padding:0 14px;background:#0a101b;
}
.field textarea{min-height:88px;padding-top:12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(125,211,252,.4);outline:none}

/* onboarding */
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{height:4px;flex:1;border-radius:99px;background:rgba(201,208,220,.14)}
.steps i.on{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.ob-status{
  margin-top:14px;padding:11px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:#0a101b;
  font-size:12.5px;color:var(--muted);
}
.ob-status b{color:var(--ink)}
.ob-status.ok{border-color:rgba(52,211,153,.3);color:#bbf7d0}
.verify-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 0;border-bottom:1px solid rgba(201,208,220,.08);
}
.verify-row:last-child{border-bottom:0}
.verify-row .vname{font-size:14px;font-weight:700}
.verify-row .vtype{display:block;font-size:11px;color:var(--muted)}
.verify-row .spacer{margin-left:auto}
.lv{
  font-family:var(--en);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  border:1px solid rgba(201,208,220,.2);color:var(--muted);
}
.lv.l1{color:#fde68a;border-color:rgba(251,191,36,.56);background:rgba(251,191,36,.12)}
.lv.l2{color:#bbf7d0;border-color:rgba(52,211,153,.56);background:rgba(52,211,153,.12)}
.lv.l3{color:#fbcfe8;border-color:rgba(244,114,182,.68);background:rgba(244,114,182,.16)}

/* discover cards */
.cand{margin-bottom:12px;overflow:hidden}
.cand-head{display:flex;align-items:center;gap:12px;padding:14px 16px 0}
.avatar{
  width:52px;height:52px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;
  font-family:var(--en);font-weight:700;font-size:19px;color:#e3f5ff;
  background:linear-gradient(135deg,#27354b,#131a28);
  border:1px solid rgba(203,213,225,.22);
}
.avatar.ai{
  position:relative;overflow:hidden;color:#fff;
  background:
    radial-gradient(circle at 26% 18%,rgba(255,255,255,.42),transparent 22%),
    linear-gradient(135deg,var(--avatar-a,#7dd3fc),var(--avatar-b,#f472b6));
}
.avatar.persona-photo,.persona-photo{
  background-image:url('../assets/profile-sprite-v1.png');
  background-size:200% 400%;
  background-position:var(--photo-x,0%) var(--photo-y,0%);
  background-repeat:no-repeat;
  background-color:#262126;
}
.avatar.uploaded{overflow:hidden;background:#262126}
.avatar.uploaded img{width:100%;height:100%;object-fit:cover}
.self-avatar{background:#f7f3f5;color:#181517}
.cand-photo{
  position:relative;width:100%;aspect-ratio:4/3;
  border-bottom:1px solid var(--line);
}
.cand-photo::after{
  content:"";position:absolute;inset:auto 0 0;height:38%;
  background:linear-gradient(transparent,rgba(11,11,13,.78));
}
.cand-photo-label{
  position:relative;z-index:1;height:58px;margin-top:-58px;padding:0 16px 13px;
  display:flex;align-items:end;justify-content:space-between;gap:12px;color:#fff;
}
.cand-photo-label b{font-size:22px;line-height:1.1}
.cand-photo-label span{font-size:12px;font-weight:800}
.consent-row{
  display:flex;align-items:flex-start;gap:10px;margin:14px 0;padding:12px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);
  color:var(--soft);font-size:12.5px;line-height:1.55;
}
.consent-row input{width:18px;height:18px;flex:0 0 auto;margin-top:1px;accent-color:var(--pink)}
.avatar.ai::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(145deg,rgba(255,255,255,.22),transparent 42%,rgba(5,7,11,.18));
}
.anime-svg,.animal-svg{position:absolute;inset:2px;z-index:1;width:calc(100% - 4px);height:calc(100% - 4px)}
.avatar-maker{
  display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;
  padding:12px;border-radius:var(--radius-sm);
  border:1px solid rgba(125,211,252,.18);background:rgba(125,211,252,.05);
}
.avatar-maker p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.avatar-maker .btn{grid-column:1 / -1;min-height:40px}
.cand-head h3{margin:0;font-size:17px}
.cand-head .meta{font-size:12px;color:var(--muted)}
.score{
  margin-left:auto;min-width:58px;min-height:40px;display:grid;place-items:center;border-radius:10px;
  font-family:var(--en);font-weight:700;color:#d7efff;
  background:rgba(125,211,252,.1);border:1px solid rgba(125,211,252,.24);
}
.cand .chips{padding:12px 16px 0}
.rule-box{
  margin:12px 16px;padding:11px 13px;border-radius:var(--radius-sm);
  border:1px solid rgba(125,211,252,.16);background:rgba(125,211,252,.045);
}
.rule-line{
  display:flex;justify-content:space-between;gap:10px;
  padding:5px 0;font-size:12.5px;color:var(--soft);
  border-bottom:1px solid rgba(148,163,184,.1);
}
.rule-line:last-child{border-bottom:0}
.pass{color:#86efac;font-weight:800}
.cand-cta{display:grid;grid-template-columns:1fr 1.35fr;gap:8px;padding:0 16px 16px}
.cand-cta .btn{min-height:42px;padding:0 12px;font-size:12.5px}
.blocked-note{
  margin-top:4px;padding:13px 16px;border-radius:var(--radius);
  border:1px dashed rgba(201,208,220,.2);color:var(--muted);font-size:12.5px;
}
.banner{
  margin-bottom:14px;padding:13px 16px;border-radius:var(--radius);
  border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.07);
  color:#fde9b8;font-size:13px;font-weight:700;
}

/* Free beta allowance */
.like-bank{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  margin-bottom:10px;padding:13px 16px;
  border:1px solid rgba(244,114,182,.28);border-radius:var(--radius);
  background:linear-gradient(120deg,rgba(244,114,182,.1),rgba(167,139,250,.05));
}
.like-bank-main{display:flex;align-items:baseline;gap:6px;color:#fbcfe8}
.like-bank-main svg{width:18px;height:18px;align-self:center}
.like-bank-main b{font-family:var(--en);font-size:22px;color:#fff;line-height:1}
.like-bank-main span{font-size:11px;color:var(--muted)}
.like-bank-detail{grid-column:1 / -1;font-size:11px;color:var(--muted);line-height:1.5}
.like-bank .btn-sm{grid-row:1;grid-column:3}
.plus-toggle{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:13px 16px;
  border:1px solid rgba(167,139,250,.3);border-radius:var(--radius);
  background:linear-gradient(120deg,rgba(167,139,250,.1),rgba(125,211,252,.05));
}
.plus-toggle-label{display:grid;gap:1px;min-width:0}
.plus-toggle-label b{font-family:var(--en);font-size:14px;color:#ede9fe}
.plus-toggle-label span{font-size:11.5px;color:var(--muted)}
.filter-toggle{
  display:grid;gap:10px;margin-bottom:12px;padding:13px 16px;
  border:1px solid rgba(201,208,220,.14);border-radius:var(--radius);
  background:rgba(247,248,251,.035);
}
.filter-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.filter-head b{font-size:13.5px}
.filter-head span{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}
.filter-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filter-actions .btn{min-height:38px;padding:0 12px;font-size:12.5px}
.search-filters{
  display:grid;gap:10px;margin-bottom:12px;padding:13px 16px;
  border:1px solid rgba(201,208,220,.14);border-radius:var(--radius);
  background:rgba(247,248,251,.035);
}
.filter-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.select-field{display:grid;gap:5px;min-width:0}
.select-field span{font-size:10.5px;color:var(--muted);font-weight:800}
.select-field select{
  width:100%;min-height:38px;padding:0 10px;border-radius:10px;
  color:var(--soft);background:#0a101b;border:1px solid rgba(201,208,220,.14);
  font-size:12px;font-weight:700;
}
.place-filter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.place-filter .btn{min-height:36px;padding:0 9px;font-size:12px}
.audience-filter{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.audience-filter .btn{min-height:36px;padding:0 10px;font-size:12px}
.filter-summary{font-size:11.5px;color:var(--muted);line-height:1.55}
.switch{
  margin-left:auto;flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:0;padding:0;position:relative;
  background:rgba(201,208,220,.2);transition:background .2s;
}
.switch.on{background:linear-gradient(90deg,#a78bfa,#7dd3fc)}
.switch.locked{cursor:default}
.switch-knob{
  position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:transform .2s;
}
.switch.on .switch-knob{transform:translateX(20px)}
.cand-locked{opacity:.96}
.cand-locked .chips{filter:saturate(.5)}
.lock-pill{
  margin-left:auto;font-family:var(--en);font-size:11px;font-weight:700;color:#ede9fe;
  padding:4px 10px;border-radius:999px;
  background:rgba(167,139,250,.16);border:1px solid rgba(167,139,250,.4);
}

/* plans */
.match-list{display:grid;gap:12px}
.match-card{
  display:grid;gap:11px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:rgba(12,16,24,.85);
}
.match-card-top{display:flex;align-items:center;gap:12px}
.match-card h3{margin:0;font-size:16px}
.match-card .meta{font-size:12px;color:var(--muted)}
.match-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.match-actions .btn{min-height:40px;padding:0 12px;font-size:12.5px}
.countdown{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:14px;padding:12px 15px;border-radius:var(--radius-sm);
  border:1px solid rgba(251,191,36,.26);background:rgba(251,191,36,.06);
  font-size:13px;color:#fde9b8;
}
.countdown b{font-family:var(--en);font-size:18px;font-variant-numeric:tabular-nums;color:#fde047}
.plan{
  position:relative;display:grid;gap:3px;padding:14px 15px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel-2);color:var(--ink);
  margin-bottom:9px;
}
.plan-when{font-family:var(--en);font-size:12px;color:var(--cyan);font-weight:600}
.plan-title{font-size:14.5px;font-weight:760;line-height:1.5}
.plan-meta{font-size:11.5px;color:var(--muted)}
.plan-meta em{font-style:normal;color:#bbf7d0}
.ticket{
  border:1px solid rgba(125,211,252,.3);border-radius:var(--radius);
  background:linear-gradient(165deg,rgba(125,211,252,.08),rgba(12,16,24,.9) 50%);
  padding:18px;margin-bottom:14px;
}
.ticket .t-label{font-family:var(--en);font-size:11px;letter-spacing:.12em;color:var(--cyan);font-weight:700}
.ticket h3{margin:6px 0 2px;font-size:19px;line-height:1.4}
.ticket .t-meta{font-size:13px;color:var(--soft)}
.ticket .t-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qr{
  margin-top:14px;height:96px;border-radius:10px;
  display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700;
  border:1px dashed rgba(201,208,220,.26);
  background:
    repeating-linear-gradient(0deg,rgba(247,248,251,.07) 0 4px,transparent 4px 8px),
    repeating-linear-gradient(90deg,rgba(247,248,251,.07) 0 4px,transparent 4px 8px);
}
.qr-card{text-align:center;padding:16px;border-radius:var(--radius);background:#f8fafc;color:#0f172a}
.qr-code{
  width:178px;height:178px;margin:10px auto;border:10px solid #fff;border-radius:12px;
  display:grid;grid-template-columns:repeat(9,1fr);gap:4px;background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}
.qr-code i{border-radius:2px;background:#0f172a}
.qr-code i.off{background:#fff}
.qr-help{font-size:12px;color:var(--muted);line-height:1.6}
.scan-frame{
  height:178px;border-radius:16px;border:1px solid rgba(125,211,252,.32);
  background:linear-gradient(180deg,rgba(125,211,252,.1),rgba(12,16,24,.92));
  position:relative;overflow:hidden;display:grid;place-items:center;color:#d7efff;font-weight:800;
}
.scan-frame::after{
  content:"";position:absolute;left:12px;right:12px;height:2px;top:24px;
  background:var(--cyan);box-shadow:0 0 18px var(--cyan);animation:scan 1.8s ease-in-out infinite alternate;
}
@keyframes scan{to{top:150px}}
.met-card{
  border:1px solid rgba(52,211,153,.34);border-radius:var(--radius);
  background:linear-gradient(165deg,rgba(52,211,153,.1),rgba(12,16,24,.9) 55%);
  padding:18px;margin-bottom:14px;text-align:center;
}
.met-card h3{margin:8px 0 4px;font-size:20px}
.met-card p{margin:0;color:var(--soft);font-size:13px}

/* talk */
.talk-shell{
  height:min(760px,calc(100dvh - 112px));min-height:580px;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
  border:1px solid rgba(201,208,220,.14);border-radius:18px;overflow:hidden;
  background:#0f1724;box-shadow:0 18px 50px rgba(0,0,0,.22);
}
.talk-shell > *{min-width:0}
.talk-header{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-bottom:1px solid rgba(201,208,220,.1);
  background:rgba(14,20,31,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.talk-header .avatar{width:40px;height:40px;font-size:14px}
.talk-title{min-width:0;flex:1}
.talk-title b{display:block;font-size:15.5px;line-height:1.25}
.talk-title span{display:block;font-size:11px;line-height:1.35;color:#9aa7ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.talk-header-actions{display:flex;gap:6px;flex:0 0 auto}
.talk-header-actions .btn{min-height:32px;padding:0 10px;font-size:11.5px;border-radius:999px}
.talk-match-strip{
  display:flex;gap:7px;overflow-x:auto;padding:8px 12px;
  border-bottom:1px solid rgba(201,208,220,.08);background:#0b111b;
  scrollbar-width:none;
}
.talk-match-strip::-webkit-scrollbar{display:none}
.talk-match-strip .chip-btn{
  white-space:nowrap;min-height:30px;padding:3px 11px;font-size:12px;
  background:rgba(247,248,251,.06);border-color:rgba(201,208,220,.12);
}
.talk-match-strip .chip-btn[aria-pressed="true"]{
  color:#052e1a;background:#86efac;border-color:#86efac;
}
.lock-note{
  display:flex;align-items:center;gap:8px;margin-bottom:14px;width:max-content;max-width:100%;
  font-size:12px;color:#bbf7d0;font-weight:700;
  border:1px solid rgba(52,211,153,.26);border-radius:999px;
  background:rgba(52,211,153,.07);padding:6px 12px;
}
.lock-note svg{width:14px;height:14px;flex:0 0 auto}
.talk-log{
  display:grid;align-content:end;gap:12px;min-height:0;overflow-y:auto;
  width:100%;padding:20px 14px 22px;scrollbar-width:none;
  background:
    linear-gradient(180deg,rgba(16,24,39,.92),rgba(13,19,30,.98)),
    #111827;
}
.talk-log::-webkit-scrollbar{display:none}
.message-row{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.message-row.me{justify-self:end;justify-content:flex-end}
.message-row:not(.me){justify-self:start}
.msg-avatar{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  color:#d7efff;font-size:11px;font-family:var(--en);font-weight:800;
  background:linear-gradient(135deg,#263244,#111827);border:1px solid rgba(201,208,220,.18);
}
.message-row.me .msg-avatar{display:none}
.message-stack{display:grid;gap:3px}
.bubble{
  position:relative;max-width:100%;padding:10px 13px;border-radius:18px;
  font-size:14px;line-height:1.62;letter-spacing:0;
  border:0;background:#f8fafc;color:#172033;
  border-bottom-left-radius:6px;box-shadow:0 5px 16px rgba(0,0,0,.13);
}
.bubble.me{
  margin-left:auto;border-bottom-right-radius:6px;border-bottom-left-radius:18px;
  background:#86efac;color:#052e1a;
}
.message-row:not(.me) .bubble::before{
  content:"";position:absolute;left:-5px;bottom:2px;border:7px solid transparent;
  border-right-color:#f8fafc;border-bottom:0;transform:rotate(-8deg);
}
.message-row.me .bubble::after{
  content:"";position:absolute;right:-5px;bottom:2px;border:7px solid transparent;
  border-left-color:#86efac;border-bottom:0;transform:rotate(8deg);
}
.bubble-label{display:block;font-size:10.5px;color:#b6c1d2;margin:0 0 2px 5px;font-weight:700}
.bubble-time{font-size:10px;color:#8f9bae;margin:1px 5px 0}
.message-row.me .bubble-time{text-align:right;color:#8ad7a8}
.choice-label{font-size:12px;color:var(--muted);font-weight:800;margin:14px 0 8px}
.ai-suggest{
  margin-top:8px;padding:8px 9px;border-radius:14px;
  border:1px solid rgba(201,208,220,.11);background:rgba(247,248,251,.045);
  min-width:0;
}
.ai-suggest-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ai-suggest-head b{font-size:12px;color:#dbeafe}
.ai-suggest-head span{font-size:10.5px;color:#8492a8;font-weight:700}
.ai-suggest .chips{gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.ai-suggest .chips::-webkit-scrollbar{display:none}
.ai-suggest .chip-btn{
  white-space:nowrap;min-height:32px;padding:5px 10px;font-size:12px;
  background:rgba(125,211,252,.07);border-color:rgba(125,211,252,.16);
}
.talk-composer{
  padding:9px 10px calc(9px + var(--sab));border-top:1px solid rgba(201,208,220,.12);
  background:#08111c;min-width:0;width:100%;
}
.talk-composer .ai-suggest{margin-top:9px}
.talk-composer .ai-suggest-head{margin-bottom:7px}
.talk-composer .choice-label{margin:9px 0 6px;font-size:11.5px}
.composer-bar{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:6px 7px;border-radius:20px;background:#f8fafc;
}
.composer-placeholder{
  min-height:34px;display:flex;align-items:center;color:#64748b;font-size:13px;font-weight:700;
  padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.composer-send{
  width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;
  color:#052e1a;background:#34d399;
}
.composer-send svg{width:18px;height:18px}
.quick-replies{display:flex;gap:7px;overflow-x:auto;margin-top:7px;scrollbar-width:none}
.quick-replies::-webkit-scrollbar{display:none}
.quick-replies .chip-btn{
  white-space:nowrap;min-height:34px;padding:5px 12px;font-size:12.5px;
  background:rgba(247,248,251,.09);border-color:rgba(201,208,220,.13);
}

/* inbound likes */
.like-inbox{margin-bottom:14px;padding:14px;border-color:rgba(244,114,182,.28);background:linear-gradient(155deg,rgba(244,114,182,.11),rgba(125,211,252,.045))}
.like-inbox-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.like-inbox-head b{font-size:14px;color:#fbcfe8}
.like-inbox-head span{font-size:11px;color:var(--muted);font-weight:800}
.like-inbox-list{display:grid;gap:9px}
.like-inbox-row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:10px;border:1px solid rgba(201,208,220,.12);border-radius:var(--radius-sm);
  background:rgba(5,7,11,.34);
}
.like-inbox-row .avatar{width:40px;height:40px;font-size:14px}
.like-inbox-row h3{margin:0;font-size:14px}
.like-inbox-row .meta{font-size:11px;color:var(--muted);margin-top:1px}
.like-inbox-row .btn{min-height:34px;padding:0 11px;font-size:12px}
.home-hero{
  display:grid;gap:12px;margin-bottom:14px;
}
.for-you-card{
  padding:16px;border-radius:var(--radius);border:1px solid rgba(125,211,252,.22);
  background:
    linear-gradient(135deg,rgba(125,211,252,.13),rgba(52,211,153,.06) 44%,rgba(247,248,251,.035)),
    rgba(12,16,24,.92);
}
.for-you-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.for-you-top b{display:block;font-size:15px;color:#dff7ff}
.for-you-top span{display:block;margin-top:2px;font-size:11.5px;color:var(--muted)}
.for-you-score{
  flex:0 0 auto;min-width:62px;text-align:center;padding:6px 9px;border-radius:12px;
  font-family:var(--en);font-weight:800;color:#052e1a;background:#86efac;
}
.for-you-reason{margin-top:12px;color:var(--soft);font-size:12.5px;line-height:1.6}
.for-you-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode-card{
  min-height:86px;padding:12px 10px;border-radius:var(--radius-sm);
  border:1px solid rgba(201,208,220,.13);background:rgba(247,248,251,.04);
  text-align:left;color:var(--ink);
}
.mode-card b{display:block;font-size:13px}
.mode-card span{display:block;margin-top:3px;font-size:10.5px;line-height:1.45;color:var(--muted)}
.date-board{
  padding:14px;border-radius:var(--radius);border:1px solid rgba(244,114,182,.22);
  background:linear-gradient(150deg,rgba(244,114,182,.09),rgba(251,191,36,.045),rgba(247,248,251,.035));
}
.date-board-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.date-board-head b{font-size:14px;color:#fbcfe8}
.date-board-head span{font-size:11px;color:var(--muted);font-weight:800}
.date-row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:10px;border-radius:var(--radius-sm);border:1px solid rgba(201,208,220,.11);
  background:rgba(5,7,11,.28);
}
.date-row + .date-row{margin-top:8px}
.date-row .avatar{width:38px;height:38px;font-size:13px}
.date-row h3{margin:0;font-size:13.5px}
.date-row .meta{margin-top:1px;font-size:11px;color:var(--muted)}
.date-row .btn{min-height:34px;padding:0 10px;font-size:12px}
.profile-meter{
  padding:11px 13px;border-radius:var(--radius-sm);border:1px solid rgba(52,211,153,.18);
  background:rgba(52,211,153,.055);color:#bbf7d0;font-size:12px;font-weight:800;
}
.profile-meter i{
  display:block;height:6px;margin-top:8px;border-radius:999px;background:rgba(52,211,153,.14);overflow:hidden;
}
.profile-meter i span{display:block;height:100%;border-radius:inherit;background:#34d399}
.cand-head .avatar.ai{width:56px;height:56px}
.cand-kicker{
  margin:10px 16px 0;padding:10px 12px;border-radius:var(--radius-sm);
  color:#dbeafe;font-size:12px;line-height:1.55;
  background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.16);
}
.compat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 16px 0;
}
.compat-item{
  padding:8px 7px;border-radius:10px;background:rgba(247,248,251,.045);
  border:1px solid rgba(201,208,220,.1);text-align:center;
}
.compat-item b{display:block;font-family:var(--en);font-size:15px;color:#fff}
.compat-item span{font-size:10px;color:var(--muted)}
.card-actions{
  display:grid;grid-template-columns:44px 1fr 44px;gap:9px;padding:14px 16px 16px;
}
.card-actions .btn{min-height:44px;padding:0 12px}
.icon-btn{
  width:44px;min-width:44px;padding:0!important;border-radius:50%;
}
.icon-btn svg{width:18px;height:18px}

/* board */
.board-rule{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;
}
.board-rule .panel{padding:12px}
.board-rule b{display:block;font-size:13px;color:#fff}
.board-rule span{display:block;margin-top:3px;font-size:11px;color:var(--muted);line-height:1.45}
.board-post{
  display:grid;gap:11px;padding:14px 16px;margin-bottom:12px;
  border:1px solid rgba(201,208,220,.13);border-radius:var(--radius);
  background:rgba(12,16,24,.9);
}
.board-post-top{display:flex;align-items:center;gap:12px}
.board-post-top .avatar{width:48px;height:48px}
.board-post h3{margin:0;font-size:16px}
.board-post .meta{font-size:12px;color:var(--muted)}
.board-post-main{
  padding:12px;border-radius:var(--radius-sm);
  border:1px solid rgba(244,114,182,.18);
  background:linear-gradient(150deg,rgba(244,114,182,.09),rgba(125,211,252,.045));
}
.board-post-main b{display:block;font-size:15px;color:#fbcfe8}
.board-post-main p{margin:4px 0 0;color:var(--soft);font-size:12.5px;line-height:1.6}
.board-tags{display:flex;gap:7px;flex-wrap:wrap}
.board-badge{
  display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;
  color:#bbf7d0;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.24);
  font-size:10.5px;font-weight:800;
}
.board-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board-actions .btn{min-height:40px;padding:0 12px;font-size:12.5px}
.board-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}

/* drum picker */
.drum{
  position:relative;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:#0a101b;padding:0 10px;
}
.drum::before{
  content:"";position:absolute;left:8px;right:8px;top:50%;height:44px;transform:translateY(-50%);
  border-top:1px solid rgba(125,211,252,.24);border-bottom:1px solid rgba(125,211,252,.24);
  background:rgba(125,211,252,.05);border-radius:8px;pointer-events:none;
}
.drum-col{
  height:132px;overflow-y:auto;scroll-snap-type:y mandatory;
  scrollbar-width:none;-ms-overflow-style:none;
  mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);
}
.drum-col::-webkit-scrollbar{display:none}
.drum-col ul{list-style:none;margin:0;padding:44px 0}
.drum-col li{
  height:44px;display:grid;place-items:center;scroll-snap-align:center;
  color:var(--muted);font-size:13.5px;font-weight:600;
  font-variant-numeric:tabular-nums;transition:color .15s;
}
.drum-col li.on{color:var(--ink);font-weight:800}

/* me */
.me-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.me-head .avatar{width:58px;height:58px;font-size:22px;position:relative}
.me-head h3{margin:0;font-size:19px}
.me-head .meta{font-size:12.5px;color:var(--muted)}
.avatar-crown{
  position:absolute;right:-3px;bottom:-2px;z-index:3;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;color:#05070b;background:#fef3c7;
  border:2px solid var(--bg);
}
.pm-badge{
  display:inline-flex;align-items:center;vertical-align:middle;margin-left:5px;
  padding:2px 7px;border-radius:999px;font-family:var(--en);font-size:10px;
  color:#fef3c7;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.34);
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.stat{padding:13px 8px;text-align:center}
.stat b{display:block;font-family:var(--en);font-size:21px}
.stat span{font-size:11px;color:var(--muted)}
.premium-card{
  margin-top:14px;padding:16px;border-color:rgba(251,191,36,.32);
  background:linear-gradient(150deg,rgba(251,191,36,.11),rgba(167,139,250,.08) 48%,rgba(12,16,24,.9));
}
.premium-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.premium-top b{display:block;color:#fef3c7}
.premium-top span{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.premium-state{
  flex:0 0 auto;padding:3px 9px;border-radius:999px;font-family:var(--en);font-size:11px;font-weight:700;
  color:#ede9fe;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.34);
}
.premium-card .btn{margin-top:13px}
.check-list{list-style:none;padding:0;display:grid;gap:9px}
.check-list li{display:flex;gap:8px;align-items:flex-start;color:var(--soft);font-size:12.5px;line-height:1.5}
.check-list svg{width:17px;height:17px;flex:0 0 auto;color:#86efac;margin-top:1px}
.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.profile-item{padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(247,248,251,.035)}
.profile-item span{display:block;font-size:10.5px;color:var(--muted);font-weight:800}
.profile-item b{display:block;margin-top:2px;font-size:13px;color:var(--soft)}
.profile-note{margin-top:9px;color:var(--muted);font-size:12.5px;line-height:1.7}
.proof-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.proof-card{
  overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:rgba(247,248,251,.035);
}
.proof-photo{
  height:104px;position:relative;display:grid;place-items:end start;padding:9px;
  background:
    radial-gradient(circle at 75% 22%,rgba(255,255,255,.45) 0 13px,transparent 14px),
    linear-gradient(155deg,var(--proof-a,#7dd3fc),var(--proof-b,#f472b6));
}
.proof-photo::before{
  content:"";position:absolute;inset:auto 0 0;height:45%;
  background:linear-gradient(12deg,rgba(5,7,11,.42),rgba(5,7,11,.06));
  clip-path:polygon(0 58%,35% 22%,60% 48%,100% 8%,100% 100%,0 100%);
}
.proof-photo b{
  position:relative;z-index:1;font-size:11px;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.45);
}
.proof-body{padding:9px 10px 10px}
.proof-body .tag{margin-bottom:6px}
.proof-body p{margin:0;font-size:11px;color:var(--muted);line-height:1.45}
.proof-more{
  display:grid;place-items:center;min-height:170px;border:1px dashed rgba(201,208,220,.2);
  border-radius:var(--radius-sm);color:var(--muted);font-size:12px;text-align:center;padding:12px;
}
.profile-sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.profile-sheet-head h3{margin:0}
.profile-sheet-head .meta{font-size:12px;color:var(--muted)}
.profile-sheet-note{
  padding:11px 13px;border-radius:var(--radius-sm);
  border:1px solid rgba(52,211,153,.22);background:rgba(52,211,153,.055);
  color:#bbf7d0;font-size:12px;line-height:1.55;
}

/* met ledger (trust ledger) */
.ledger-count{
  display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  font-family:var(--en);font-size:11px;font-weight:700;color:#c9f7e4;
  background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.34);vertical-align:middle;
}
.ledger-empty{
  padding:16px;border:1px dashed rgba(201,208,220,.2);border-radius:var(--radius);
  color:var(--muted);font-size:12.5px;line-height:1.7;
}
.ledger{display:grid;gap:0}
.ledger-row{display:grid;grid-template-columns:24px 1fr;gap:10px}
.ledger-rail{position:relative;display:flex;justify-content:center}
.ledger-rail::before{
  content:"";position:absolute;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,rgba(52,211,153,.4),rgba(52,211,153,.08));
}
.ledger-row:first-child .ledger-rail::before{top:7px}
.ledger-row:last-child .ledger-rail::before{bottom:auto;height:9px}
.ledger-dot{
  position:relative;z-index:1;margin-top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.14);
}
.ledger-body{
  padding:0 0 18px 2px;min-width:0;
}
.ledger-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ledger-top b{font-size:15px}
.met-badge{
  font-family:var(--en);font-size:10px;font-weight:700;color:#c9f7e4;
  padding:2px 7px;border-radius:999px;
  background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.34);
}
.ledger-date{margin-left:auto;font-family:var(--en);font-size:12px;color:var(--muted)}
.ledger-plan{margin-top:4px;font-size:13px;color:var(--soft)}
.ledger-revs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.rev-pill{
  font-size:11px;font-weight:700;color:var(--soft);
  padding:3px 9px;border-radius:999px;
  background:rgba(247,248,251,.04);border:1px solid rgba(201,208,220,.16);
}

/* invite card */
.invite-card{
  padding:18px;
  border-color:rgba(167,139,250,.3);
  background:linear-gradient(165deg,rgba(167,139,250,.1),rgba(125,211,252,.05) 50%,rgba(12,16,24,.9));
}
.invite-lead{font-size:13px;color:var(--soft);line-height:1.7}
.invite-lead b{color:#ddd6fe}
.invite-code-row{
  display:flex;align-items:center;gap:12px;margin-top:14px;
  padding:13px 14px;border-radius:var(--radius-sm);
  border:1px dashed rgba(167,139,250,.4);background:rgba(10,15,27,.7);
}
.invite-code{display:grid;gap:2px;min-width:0}
.invite-code-label{font-size:10.5px;color:var(--muted);font-weight:700}
.invite-code b{font-size:24px;letter-spacing:.18em;color:#ede9fe;line-height:1.1}
.invite-code-row .btn{margin-left:auto;flex:0 0 auto}
.invite-prog{margin-top:14px}
.invite-prog-bar{
  height:8px;border-radius:999px;overflow:hidden;
  background:rgba(201,208,220,.12);
}
.invite-prog-bar i{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#a78bfa,#7dd3fc);transition:width .4s ease;
}

.invite-prog-label b{color:var(--soft)}
#invite-share svg{width:18px;height:18px}

/* verify animation */
.verify-anim{padding:8px 4px 4px}
.verify-scan{
  position:relative;height:120px;border-radius:var(--radius);overflow:hidden;
  display:grid;place-items:center;
  border:1px solid rgba(125,211,252,.24);
  background:
    radial-gradient(120% 80% at 50% 0,rgba(125,211,252,.12),transparent 70%),
    repeating-linear-gradient(0deg,rgba(125,211,252,.05) 0 2px,transparent 2px 12px),
    #0a101b;
}
.verify-scan-tag{
  font-size:15px;font-weight:800;color:#d7efff;letter-spacing:.02em;z-index:1;
  padding:6px 14px;border-radius:999px;
  background:rgba(10,16,27,.7);border:1px solid rgba(125,211,252,.3);
}
.verify-scan-line{
  position:absolute;left:0;right:0;top:0;height:34px;
  background:linear-gradient(180deg,rgba(125,211,252,.42),transparent);
  border-bottom:2px solid rgba(125,211,252,.85);
  animation:scanmove 1.1s ease-in-out infinite;
}
@keyframes scanmove{0%{top:-34px}100%{top:120px}}
.verify-bar{height:6px;border-radius:999px;overflow:hidden;background:rgba(201,208,220,.12);margin-top:16px}
.verify-bar i{display:block;height:100%;width:6%;border-radius:999px;
  background:linear-gradient(90deg,#7dd3fc,#a78bfa);transition:width 1.7s ease}
.verify-step{margin-top:12px;text-align:center;color:var(--soft);font-size:13px;font-weight:600;min-height:18px}
.verify-done{
  width:64px;height:64px;margin:8px auto 0;display:grid;place-items:center;border-radius:50%;
  color:#062c1c;background:linear-gradient(135deg,#34d399,#7dd3fc);
  animation:pop .4s ease;
}
.verify-done svg{width:34px;height:34px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .verify-scan-line{animation:none;top:43px}
  .verify-done{animation:none}
  .verify-bar i{transition:none;width:100%!important}
}

.btn-like svg{width:18px;height:18px;color:#f472b6}
.like-anim{padding:14px 4px 4px;display:grid;justify-items:center}
.like-burst{color:var(--pink);animation:beat 1s ease-in-out infinite}
.like-burst svg{width:60px;height:60px}

.like-step{margin-top:14px;text-align:center;color:var(--soft);font-size:13.5px;font-weight:600}
.like-done{

}
.like-done svg{width:38px;height:38px}

/* tab bar */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:25;
  width:min(100%,520px);
  display:none;grid-template-columns:repeat(5,1fr);
  padding:8px 10px calc(8px + var(--sab));
  background:rgba(5,7,11,.88);
  border-top:1px solid var(--line);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.tabbar.on{display:grid}
.tab{
  display:grid;justify-items:center;gap:3px;padding:6px 0;border:0;background:none;
  color:var(--muted);font-size:10px;font-weight:800;border-radius:10px;
}
.tab svg{width:20px;height:20px}
.tab[aria-current="true"]{color:#d7efff}
.tab .dot{
  position:absolute;margin-left:26px;margin-top:-2px;
  width:8px;height:8px;border-radius:50%;background:var(--pink);display:none;
}
.tab.has-dot .dot{display:block}

/* overlay sheet */
.overlay{
  position:fixed;inset:0;z-index:40;display:none;
  background:rgba(3,5,8,.66);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.overlay.on{display:grid;align-items:end;justify-items:center}
.sheet{
  width:min(100%,520px);max-height:86dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;
  border:1px solid var(--line);border-bottom:0;
  background:#0a0f18;
  padding:20px 18px calc(20px + var(--sab));
  animation:up .26s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.sheet .actions{display:grid;gap:9px;margin-top:16px}

/* toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:60;
  bottom:calc(96px + var(--sab));
  max-width:min(92%,480px);
  padding:11px 18px;border-radius:999px;
  background:#131b29;border:1px solid rgba(125,211,252,.3);
  color:#e3f5ff;font-size:13px;font-weight:700;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

  photo:    ['写真フォルダを読み込み中…', '体験写真として確認…', 'プロフィール掲載用に保存…'],
  question: ['回答を読み込み中…', '価値観の一貫性をチェック…'],

function openVerify(id){
  var t = TAG_BY_ID[id], v = VERIFY[t.verify];
  sheet('<h3>「'+esc(t.label)+'」を証明</h3><p class="sub">'+v.name+' — '+v.desc+'</p>'
    + '<div class="actions">'
    + '<button class="btn btn-primary" id="v-go">'+v.action+'</button>'
    + '<button class="btn btn-outline" id="v-cancel">キャンセル</button>'

function runVerify(id){
  var t = TAG_BY_ID[id], v = VERIFY[t.verify];
  var steps = VERIFY_STEPS[t.verify] || ['認証中…'];
  $('#sheet').innerHTML =
      '<div class="verify-anim">'
    + '<div class="verify-scan" id="v-scan"><div class="verify-scan-line"></div><span class="verify-scan-tag">'+esc(t.label)+'</span></div>'
    + '<div class="verify-bar"><i id="v-bar"></i></div>'
    + '<div class="verify-step" id="v-step">'+esc(steps[0])+'</div>'
    + '</div>';
  var bar = $('#v-bar'), step = $('#v-step');
  var i = 0, n = steps.length, per = 620;
  // kick the bar
  setTimeout(function(){ if (bar) bar.style.width = '100%'; }, 30);
  var iv = setInterval(function(){
    i++;
    if (i < n){ if (step) step.textContent = steps[i]; }
  }, per);
  setTimeout(function(){
    clearInterval(iv);
    ob.picked[id] = v.level;
    if (!ob.proofs) ob.proofs = {};
    ob.proofs[id] = makeProof(id);
    var scan = $('#v-scan');
    $('#sheet').innerHTML =
        '<div class="verify-anim">'
      + '<div class="verify-done" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>'
      + '<h3 style="text-align:center;margin-top:6px">認証完了</h3>'
      + '<p class="sub" style="text-align:center">写真フォルダの証拠写真で「'+esc(t.label)+'」を<b style="color:#bbf7d0">'+levelText(v.level)+'</b>として証明しました。</p>'
      + '<div class="actions"><button class="btn btn-primary" id="v-ok">続ける</button></div>';
    var ok = $('#v-ok');
    if (ok) ok.addEventListener('click', function(){ closeSheet(); renderOnboard(); });
    // auto-advance shortly after
    setTimeout(function(){ if (document.getElementById('v-ok')){ closeSheet(); renderOnboard(); } }, 1400);
  }, per * n + 200);
}

  post.likes = (post.likes || 0) + 1;

  var shared = c ? c.shared : userTagIds().slice(0,3);
  if (!shared.length) shared = ['cafe'];
  var m = {
    id: matchIdFrom({i:post.ci || 99}),
    ci: post.ci,
    name: post.name,
    age: post.age,
    gender: post.gender,
    area: post.area,
    vibe:'今日会いたい',
    score:c ? c.score : 72,
    shared:shared,
    matchedAt:Date.now(),
    deadline:Date.now() + 24*3600*1000,

    met:false,
    reviewed:[],

function planCandidates(m){
  m = m || activeMatch();
  var used = {}, out = [];
  m.shared.forEach(function(id){
    if (out.length>=3) return;
    var tpl = PLAN_TPL[id];
    if (tpl){
      tpl = planTplForPlace(tpl, m, id);
      if (!used[tpl.title]){ used[tpl.title]=1; out.push({tag:id, tpl:tpl}); }
    }
  });
  var i = 0;
  while (out.length<3){
    var ids = m.shared && m.shared.length ? m.shared : ['cafe'];
    var id = ids[i % ids.length]; i++;
    var fallback = planTplForPlace(null, m, id);
    var key = fallback.title;
    if (used[key]){
      key = key+' '+(out.length+1);
      fallback = {title:key, spot:fallback.spot, stations:fallback.stations, badge:fallback.badge};
    }
    used[key]=1;
    out.push({tag:id, tpl:fallback});
  }
  return out;
}

function drumCol(items, onIdx){
  return '<div class="drum-col"><ul>'+items.map(function(it,i){
    return '<li class="'+(i===onIdx?'on':'')+'">'+esc(it)+'</li>';
  }).join('')+'</ul></div>';
}
function initDrums(root){
  root.querySelectorAll('.drum-col').forEach(function(col){
    var items = col.querySelectorAll('li');
    var update = function(){
      var rect = col.getBoundingClientRect(), mid = rect.top + rect.height/2;
      var best = null, bd = Infinity;
      items.forEach(function(li){
        var r = li.getBoundingClientRect();
        var d = Math.abs(r.top + r.height/2 - mid);
        if (d < bd){ bd = d; best = li; }
      });
      items.forEach(function(li){ li.classList.toggle('on', li===best); });
    };
    var init = col.querySelector('li.on');
    if (init) col.scrollTop = Array.prototype.indexOf.call(items, init) * 44;
    col.addEventListener('scroll', update, {passive:true});
    update();
  });
}

function qrPatternHTML(seed){
  var n = 0, s = String(seed || 'TAG');
  for (var i=0;i<s.length;i++) n += s.charCodeAt(i) * (i+5);
  var html = '<div class="qr-code" aria-hidden="true">';
  for (var j=0;j<81;j++){
    var finder = (j<21 && (j%9<3 || Math.floor(j/9)<3)) || (j%9>5 && Math.floor(j/9)<3) || (j%9<3 && Math.floor(j/9)>5);
    var on = finder || ((j*n + j*j + n) % 5 < 2);
    html += '<i class="'+(on?'':'off')+'"></i>';
  }
  return html + '</div>';
}

    var upgraded = 0, progressed = 0;
    m.shared.forEach(function(id){

      : (progressed ? 'Met認証が成立。共通タグのレベル進行が増えました' : 'Met認証が成立。合流履歴を記録しました'));

function aiTopics(m){

    if (!v || seen[v] || out.length>=8) return;

  };
  (m.shared || []).forEach(function(id){ if (TAG_BY_ID[id]) add(TAG_BY_ID[id].label); });
  var text = (m.talk || []).map(function(x){ return x.text; }).join(' ');
  TAGS.forEach(function(t){ if (text.indexOf(t.label) >= 0) add(t.label); });
  if (m.plan){ add(m.plan.spot); add(m.plan.when); }

function topicPhrase(topic, m){

function aiReplyFor(text, m){
  if (text.indexOf('候補日') >= 0) return 'ありがとうございます！その中なら合わせられそうです。';
  if (text.indexOf('平日') >= 0 || text.indexOf('土日') >= 0) return 'その時間帯いいですね。予定候補から選びましょう！';
  if (text.indexOf('中間') >= 0) return '中間地点ありがたいです。駅の候補を見て決めたいです。';
  var topics = aiTopics(m);
  if (topics.length) return topics[(text.length + topics.length) % topics.length]+'、わたしも話しやすいです！';
  return REPLIES[(text.length + (m.talk || []).length) % REPLIES.length];
}

}
function openCandidateProfile(i){
  var c = buildCandidates()[i];
  if (!c) return;
  publicProfileSheet(c.p, c.shared, {likeIndex:i, premium:hasTagPlus()});
}
function openMatchProfile(matchId){
  var m = matches().find(function(x){ return x.id === matchId; });
  if (!m) return;
  var p = personaByIndex(m.ci) || {name:m.name, age:m.age, gender:m.gender, area:m.area, vibe:m.vibe, job:m.job, income:m.income, height:m.height};
  publicProfileSheet(p, m.shared, {matchId:m.id, met:m.met, premium:false});
}
function openProfileEdit(){
  ensureProfileDetails(state.profile);
  var d = state.profile.details;
  sheet('<h3>プロフィールを編集</h3><p class="sub">職業や年収など、よくあるプロフィール項目を選択だけで編集できます。</p>'
    + '<div class="field"><label for="pf-job">職業</label><select id="pf-job">'
    + optionsHTML(['未設定','会社員','エンジニア','デザイナー','企画・マーケ','営業','公務員','医療系','教育系','美容系','飲食・サービス','経営者・役員','フリーランス','学生'], d.job)
    + '</select></div>'
    + '<div class="field"><label for="pf-income">年収</label><select id="pf-income">'
    + optionsHTML(['未設定','300万円未満','300-500万円','500-700万円','700-1000万円','1000万円以上'], d.income)
    + '</select></div>'
    + '<div class="field"><label for="pf-height">身長</label><select id="pf-height">'
    + optionsHTML(['未設定','150cm未満','150-154cm','155-159cm','160-164cm','165-169cm','170-174cm','175-179cm','180cm以上'], d.height)
    + '</select></div>'
    + '<div class="field"><label for="pf-residence">居住地</label><select id="pf-residence">'
    + optionsHTML(['東京都','神奈川県','千葉県','埼玉県','その他'], d.residence)
    + '</select></div>'
    + '<div class="field"><label for="pf-education">学歴</label><select id="pf-education">'
    + optionsHTML(['未設定','高校卒','専門卒','大学卒','大学院卒'], d.education)
    + '</select></div>'
    + '<div class="field"><label for="pf-alcohol">お酒</label><select id="pf-alcohol">'
    + optionsHTML(['未設定','飲まない','たまに飲む','よく飲む'], d.alcohol)
    + '</select></div>'
    + '<div class="field"><label for="pf-bio">ひとこと</label><select id="pf-bio">'
    + optionsHTML([
      PROFILE_DEFAULTS.bio,
      'まずは気軽に60分で話してみたいです。',
      '共通の趣味から自然に仲良くなりたいです。',
      '休日に一緒に出かけられる人と会いたいです。',
      '落ち着いた場所でゆっくり話すのが好きです。',
      '友達からでも、ちゃんと会える出会いがいいです。'
    ], d.bio)
    + '</select></div>'
    + '<div class="actions"><button class="btn btn-primary" id="pf-save">保存</button>'
    + '<button class="btn btn-outline" id="pf-cancel">閉じる</button></div>');
  $('#pf-save').addEventListener('click', function(){
    state.profile.details = {
      job: $('#pf-job').value,
      income: $('#pf-income').value,
      height: $('#pf-height').value,
      residence: $('#pf-residence').value,
      education: $('#pf-education').value,
      alcohol: $('#pf-alcohol').value,
      bio: $('#pf-bio').value
    };
    save(); closeSheet(); renderMe();
    toast('プロフィールを保存しました');
  });
  $('#pf-cancel').addEventListener('click', closeSheet);
}
function optionHTML(value, current){
  return '<option value="'+esc(value)+'"'+(value===current?' selected':'')+'>'+esc(value)+'</option>';
}
function optionsHTML(values, current){
  return values.map(function(v){ return optionHTML(v, current); }).join('');
}
function selfToolsHTML(){
  return '<div class="cat-label">自分を整える</div>'
    + '<div class="mode-grid">'
    + '<button class="mode-card" data-mode="diagnosis"><b>相性診断</b><span>価値観タグを追加して相性精度を上げる</span></button>'
    + '<button class="mode-card" data-mode="tag"><b>好みカード</b><span>キーワード追加で候補と会話を広げる</span></button>'
    + '<button class="mode-card" data-mode="safe"><b>安心設定</b><span>認証・合流・評価の仕組みを確認</span></button>'
    + '</div>';
}
function renderMe(){
  var el = $('#s-me');
  var p = state.profile;
  if (!p) return;
  ensureProfileDetails(p);
  ensureTagProofs(p);
  var ids = userTagIds();
  var maxLv = ids.reduce(function(n,id){ return Math.max(n, lv(id)); }, 0);
  var lv10 = ids.filter(function(id){ return lv(id)>=MAX_TAG_LEVEL; }).length;
  var html = '<h2 class="screen-title">じぶん</h2>'
    + '<div class="me-head">'+avatarHTML(p, false)
    + '<div><h3>'+esc(p.name)+' <span class="pm-badge">FREE BETA</span></h3>'
    + '<div class="meta">東京 / '+genderLabel(p.gender)+' / 18歳以上確認済み（体験用）</div></div></div>'
    + '<div class="stat-grid">'
    + '<div class="panel stat"><b>'+ids.length+'</b><span>認証タグ</span></div>'
    + '<div class="panel stat"><b>'+state.metCount+'</b><span>Met認証</span></div>'
    + '<div class="panel stat"><b>'+totalLikes()+'</b><span>いいね残</span></div>'
    + '</div>'
    + '<div class="cat-label">あなたの認証タグ</div><div class="chips">'
    + ids.map(function(id){ return tagChip(id,true); }).join('')
    + '</div>'
    + (maxLv>0 ? '<div class="blocked-note" style="margin-top:14px">最高'+levelLabel(maxLv)+' / '+MAX_TAG_LEVEL+'。'+(lv10 ? '最大レベル到達タグが'+lv10+'個あります。' : '会えた実績が、次の出会いで優先表示につながります。')+'</div>' : '')
    + profileCardHTML()
    + selfToolsHTML()
    + tagProofsHTML()
    + premiumCardHTML()
    + inviteCardHTML()
    + metLedgerHTML()
    + '<div class="cat-label">アプリ</div>'
    + '<div style="display:grid;gap:9px">'
    + '<button class="btn btn-ghost" id="me-avatar">プロフィール写真を変更</button>'
    + '<button class="btn btn-outline" id="me-install">ホーム画面に追加（PWA）</button>'
    + '<button class="btn btn-danger" id="me-reset">体験データをリセット</button>'
    + '</div>'
    + '<p class="screen-sub" style="margin-top:14px">公開ベータの体験データは、この端末のlocalStorageにのみ保存され、実ユーザーには送信されません。</p>';
  el.innerHTML = html;
  bindInvite();
  var pm = $('#premium-manage');
  if (pm) pm.addEventListener('click', openPremium);
  $('#profile-edit').addEventListener('click', openProfileEdit);
  el.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click', function(){ openModeSheet(b.getAttribute('data-mode')); });
  });
  $('#me-avatar').addEventListener('click', function(){
    sheet('<h3>プロフィール写真</h3><p class="sub">写真変更は初回登録画面で体験できます。本番版では本人確認済み写真のみ公開されます。</p><div class="actions"><button class="btn btn-primary" id="avatar-close">確認しました</button></div>');
    $('#avatar-close').addEventListener('click', closeSheet);
  });
  $('#me-reset').addEventListener('click', function(){
    sheet('<h3>体験データをリセット</h3><p class="sub">タグ・マッチ・トークの記録をこの端末から消去します。</p>'
      + '<div class="actions"><button class="btn btn-danger" id="rs-ok">リセットする</button>'
      + '<button class="btn btn-outline" id="rs-cancel">キャンセル</button></div>');
    $('#rs-ok').addEventListener('click', function(){
      localStorage.removeItem(KEY);
      location.reload();
    });
    $('#rs-cancel').addEventListener('click', closeSheet);
  });
  $('#me-install').addEventListener('click', function(){
    if (window.__bip){ window.__bip.prompt(); return; }
    sheet('<h3>ホーム画面に追加</h3><p class="sub">iOS Safari: 共有ボタン → 「ホーム画面に追加」。<br>Android Chrome: メニュー → 「アプリをインストール」。</p>'
      + '<div class="actions"><button class="btn btn-outline" id="in-ok">閉じる</button></div>');
    $('#in-ok').addEventListener('click', closeSheet);
  });
}
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__bip = e; });

/* ================= boot ================= */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    var id = t.getAttribute('data-go');
    if (id==='home') renderHome();
    if (id==='board') renderBoard();
    if (id==='plans') renderPlans();
    if (id==='talk') renderTalk();
    if (id==='me') renderMe();
    show(id);
  });
});
if (state.profile){
  $('#tabbar').classList.add('on');
  renderHome(); renderBoard(); renderPlans(); renderTalk(); renderMe();
  show('home');
} else {
  renderOnboard();
  show('onboard');
}
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
